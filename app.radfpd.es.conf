<VirtualHost *:80>

    ServerName app.radfpd.es

    ServerAlias 79.72.63.217

    DocumentRoot /var/www/html/app.radfpd.es


    <Directory /var/www/html/app.radfpd.es>

        Options Indexes FollowSymLinks

        AllowOverride All

        Require all granted

    </Directory>

    Alias /mh-torremolinos /var/www/html/mh-torremolinos

    <Directory /var/www/html/mh-torremolinos>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /mh-torremolinos/index.html [L]
    </Directory>


    ErrorLog ${APACHE_LOG_DIR}/app.radfpd.es-error.log

    CustomLog ${APACHE_LOG_DIR}/app.radfpd.es-access.log combined

</VirtualHost>


